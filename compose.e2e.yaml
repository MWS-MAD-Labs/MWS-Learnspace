name: learnspace-attendance-e2e

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learnspace_e2e
      POSTGRES_USER: learnspace
      POSTGRES_PASSWORD: e2e-password
    volumes:
      - e2e-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U learnspace -d learnspace_e2e']
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://learnspace:e2e-password@db:5432/learnspace_e2e
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    networks:
      - backend

  fixture:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    command: ['npm', 'run', 'db:seed:e2e', '-w', '@learnspace/api']
    environment:
      NODE_ENV: test
      ALLOW_DATABASE_SEED: 'true'
      DATABASE_URL: postgresql://learnspace:e2e-password@db:5432/learnspace_e2e
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://learnspace:e2e-password@db:5432/learnspace_e2e
      APP_URL: http://127.0.0.1:${E2E_WEB_PORT:-3001}
      SESSION_SECRET: attendance-e2e-session-secret-at-least-32-characters
      GOOGLE_CLIENT_ID: development-placeholder
      GOOGLE_CLIENT_SECRET: development-placeholder
      GOOGLE_ALLOWED_DOMAINS: ''
      GOOGLE_REDIRECT_URI: http://127.0.0.1:${E2E_WEB_PORT:-3001}/api/v1/auth/callback
      AUTH_ADMISSION_MODE: DENY_UNKNOWN
      SESSION_TTL_HOURS: 1
      TRUSTED_PROXIES: linklocal,uniquelocal
      API_RATE_LIMIT_REQUESTS: 10000
      API_RATE_LIMIT_WINDOW_SECONDS: 60
      AUTH_RATE_LIMIT_REQUESTS: 1000
      AUTH_RATE_LIMIT_WINDOW_SECONDS: 60
      LOG_LEVEL: info
      E2E_AUTH_SECRET: attendance-e2e-auth-secret-at-least-32-characters
      E2E_AUTH_USER_EMAIL: attendance.teacher@example.test
    depends_on:
      fixture:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 20
    networks:
      - frontend
      - backend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:${E2E_WEB_PORT:-3001}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - frontend

volumes:
  e2e-postgres-data:

networks:
  frontend:
  backend:
    internal: true
