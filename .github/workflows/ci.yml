name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: learnspace_test
          POSTGRES_USER: learnspace
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnspace -d learnspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://learnspace:test-password@localhost:5432/learnspace_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and generate Prisma client
        run: npm run prisma:validate && npm run prisma:generate

      - name: Apply migrations to an empty database
        run: npm run db:migrate:deploy

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run database integration tests
        run: npm run test:integration -w @learnspace/api

      - name: Build
        run: npm run build

      - name: Build API runtime image
        run: docker build --file apps/api/Dockerfile --target runtime --tag learnspace-api:ci .

      - name: Build migration image
        run: docker build --file apps/api/Dockerfile --target migration --tag learnspace-migrate:ci .

  attendance-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Compose-backed attendance E2E
        run: npm run e2e:attendance

      - name: Upload E2E artifacts and Compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-e2e-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down attendance E2E stack
        if: always()
        run: npm run e2e:attendance:stop
