name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: learnspace_test
          POSTGRES_USER: learnspace
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnspace -d learnspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://learnspace:test-password@localhost:5432/learnspace_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate and generate Prisma client
        run: bun run prisma:validate && bun run prisma:generate

      - name: Apply migrations to an empty database
        run: bun run db:migrate:deploy

      - name: Check formatting
        run: bun run format:check

      - name: Lint with Oxlint
        run: bun run lint

      - name: Check custom anti-slop rules
        run: bun run lint:anti-slop

      - name: Type check with TypeScript 7 tsc
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Run database integration tests
        run: bun run --filter @learnspace/api test:integration

      - name: Build
        run: bun run build

      - name: Build API runtime image
        run: docker build --file apps/api/Dockerfile --target runtime --tag learnspace-api:ci .

      - name: Build migration image
        run: docker build --file apps/api/Dockerfile --target migration --tag learnspace-migrate:ci .

  attendance-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Compose-backed attendance E2E
        run: bun run e2e:attendance

      - name: Upload E2E artifacts and Compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-e2e-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down attendance E2E stack
        if: always()
        run: bun run e2e:attendance:stop
