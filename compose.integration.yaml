name: learnspace-integration

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learnspace_test
      POSTGRES_USER: learnspace
      POSTGRES_PASSWORD: test-password
    ports:
      - '127.0.0.1:${INTEGRATION_DB_PORT:-55433}:5432'
    volumes:
      - integration-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U learnspace -d learnspace_test']
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  integration-postgres-data:
